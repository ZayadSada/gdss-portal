<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - GDSS Gidan Igwai</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 750px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2, h3 { text-align: center; color: #1e3a8a; margin: 5px 0; }
        h3 { font-size: 16px; color: #555; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }
        
        label { font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background-color: #fafafa; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #1e3a8a; background-color: #fff; }
        
        /* Shashen Hoto */
        .image-upload-box { grid-column: span 2; background: #eee; padding: 15px; border-radius: 6px; text-align: center; margin-top: 15px; }
        @media (max-width: 600px) { .image-upload-box { grid-column: span 1; } }
        img#imagePreview { width: 100%; max-width: 200px; height: auto; border-radius: 4px; display: none; margin: 10px auto; border: 2px solid #28a745; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 25px; }
        .btn-submit:hover { background-color: #218838; }
        
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        .nav-links a { color: #dc3545; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="nav-links">
        <span style="color: #1e3a8a;">🏠 GDSS GIDAN IGWAI (STUDENTS)</span>
        <a href="admin-login.html">➔ Logout</a>
    </div>

    <h2>👤 Detailed Student Registration</h2>
    <h3>Please provide precise enrollment data to register the student.</h3>
    
    <form id="studentRegistrationForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Admission Number</label>
                <input type="text" id="admissionNum"  placeholder="e.g., GDSS/GI/2026/104" required>
            </div>
            <div class="form-group">
                <label>NIN Number</label>
                <input type="text" id="ninNumber"placeholder="e.g., NIN.........." required>
            </div>
            <div class="form-group">
                <label>Student Surname</label>
                <input type="text" id="surname"  placeholder="Family Name" required>
            </div>
            <div class="form-group">
                <label>Student First Name</label>
                <input type="text" id="firstName"  placeholder="Given Name" required>
            </div>
            <div class="form-group">
                <label>Student Middle Name</label>
                <input type="text" id="middleName" placeholder="Optional Name">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male </option>
                    <option value="Female">Female </option>
                </select>
            </div>
            <div class="form-group">
                <label>Entry Academic Year</label>
                <input type="text" id="academicYear" required placeholder=" 2025/2026">
            </div>
            <div class="form-group">
                <label>Student Current Class</label>
                <select id="currentClass" required>
                    <option value="">-- Select Class  --</option>
                    <option value="JSS 1">JSS 1</option>
                    <option value="JSS 2">JSS 2</option>
                    <option value="JSS 3">JSS 3</option>
                    <option value="SS 1">SS 1</option>
                    <option value="SS 2">SS 2</option>
                    <option value="SS 3">SS 3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Student Phone</label>
                <input type="text" id="phone" placeholder="e.g , 2348030000000" required>
            </div>
            <div class="form-group">
                <label>Student Parent/Guardian Name</label>
                <input type="text" id="parentName" placeholder="Full name of sponsor" required>
            </div>
            <div class="form-group">
                <label>Parent/Guardian Phone Number</label>
                <input type="text" id="parentPhone" placeholder="e.g , 2348030000000" required >
            </div>
            <div class="form-group full-width">
                <label>Student Address</label>
                <textarea id="address" rows="2" placeholder="Residential Street Address, Sokoto" required></textarea>
            </div>
            
            <!-- Shashen Zaɓan Hoto Daga Na'ura -->
            <div class="image-upload-box">
                <label style="display:block; margin-bottom:10px; font-weight: bold;">📸 Upload Student Passport Image</label>
                <input type="file" id="hotoInput" accept="image/*" required style="background: white; width: 100%; border: 1px dashed #777; padding: 10px;">
                <img id="imagePreview" alt="Preview na hoton da aka zaba">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Save Complete Student Record</button>
    </form>
</div>

<script>
    const hotoInput = document.getElementById('hotoInput');
    const imagePreview = document.getElementById('imagePreview');
    const form = document.getElementById('studentRegistrationForm');
    const submitBtn = document.getElementById('submitBtn');

    // TABBATAR KA KANZO WANNAN ZUWA SARIFA WEB APP URL ƊINKA MAI /EXEC A ƘARSHE
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyGReM_pAF-MMu3AiLF4Rz4nzd3q3vL5yNQABXxdZnHTfQrw21IY5SvTXR96hemnAeZ/exec'; 

    let hotoBase64 = ""; 

    // Nuna hoton da aka zaba kafin a aika
    hotoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                hotoBase64 = e.target.result;
                imagePreview.src = hotoBase64;
                imagePreview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    form.addEventListener('submit', e => {
        e.preventDefault();
        if (!hotoBase64) {
            alert("Please select a student image first!");
            return;
        }

        submitBtn.innerText = "Submitting data... Please wait";
        submitBtn.disabled = true;

        const admission = document.getElementById('admissionNum').value.replace(/\//g, "-");
        const sunanDalibi = document.getElementById('firstName').value + "_" + document.getElementById('surname').value;
        const sunanHoto = "Student_" + admission + "_" + sunanDalibi + ".jpg";

        const studentData = {
            action: "addStudent",
            admissionNum: document.getElementById('admissionNum').value,
            ninNumber: document.getElementById('ninNumber').value,
            surname: document.getElementById('surname').value,
            firstName: document.getElementById('firstName').value,
            middleName: document.getElementById('middleName').value,
            dob: document.getElementById('dob').value,
            gender: document.getElementById('gender').value,
            academicYear: document.getElementById('academicYear').value,
            currentClass: document.getElementById('currentClass').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            parentName: document.getElementById('parentName').value,
            parentPhone: document.getElementById('parentPhone').value,
            hotoData: hotoBase64, 
            hotoName: sunanHoto,
            hotoMimeType: "image/jpeg"
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentData)
        })
        .then(() => {
            alert('✅ Success! Student record and image have been sent to Google Sheet.');
            form.reset();
            imagePreview.style.display = 'none';
            hotoBase64 = "";
            submitBtn.innerText = "Save Complete Student Record";
            submitBtn.disabled = false;
        })
        .catch(error => {
            alert('An error occurred while sending the data!');
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
