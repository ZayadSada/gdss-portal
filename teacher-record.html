<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Records - GDSS Gidan Igwai</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 750px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2, h3 { text-align: center; color: #0b5ed7; margin: 5px 0; }
        h3 { font-size: 16px; color: #555; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }
        
        label { font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background-color: #fafafa; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0b5ed7; background-color: #fff; }
        
        /* Shashen Hoto */
        .image-upload-box { grid-column: span 2; background: #eee; padding: 15px; border-radius: 6px; text-align: center; margin-top: 15px; }
        @media (max-width: 600px) { .image-upload-box { grid-column: span 1; } }
        img#imagePreview { width: 100%; max-width: 200px; height: auto; border-radius: 4px; display: none; margin: 10px auto; border: 2px solid #0b5ed7; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #0b5ed7; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 25px; }
        .btn-submit:hover { background-color: #0a58ca; }
        
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        .nav-links a { color: #dc3545; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="nav-links">
        <span style="color: #0b5ed7;">🏠 GDSS GIDAN IGWAI (TEACHERS)</span>
        <a href="admin-login.html">➔ Logout</a>
    </div>

    <h2>👨‍🏫 Detailed Staff Registration</h2>
    <h3>Please provide precise employment data to register the staff/teacher into the database.</h3>
    
    <form id="teacherRegistrationForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Staff ID Number</label>
                <input type="text" id="staffId" placeholder="e.g., TS/GDSS/409" required >
            </div>
            <div class="form-group">
                <label>NIN Number</label>
                <input type="text" id="ninNumber" placeholder="e.g., NIN....." required >
            </div>
            <div class="form-group">
                <label>Surname</label>
                <input type="text" id="surname" placeholder="Family Name" required>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="Given Name" required>
            </div>
            <div class="form-group">
                <label>Middle Name</label>
                <input type="text" id="middleName"  placeholder="Optional Name">
            </div>
	<div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>


            <div class="form-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Highest Qualification</label>
                <input type="text" id="qualification" required placeholder=" e.g  NCE, B.Ed, M.Sc">
            </div>
            <div class="form-group">
                <label>Staff Type</label>
                <select id="staffType" required>
                    <option value="">-- Select Staff Type --</option>
                    <option value="Permanent">Permanent</option>
                    <option value="Part-Time">Part-Time</option>
                </select>
            </div>
            <div class="form-group">
                <label>Computer Number</label>
                <input type="text" id="computerNum" placeholder="Computer Number">
            </div>
            <div class="form-group">
                <label>Main Subject Taught</label>
                <input type="text" id="subject" required placeholder="e.g Mathematics, Hausa">
            </div>
            <div class="form-group">
                <label>Year of Employment</label>
                <input type="number" id="employmentYear" required placeholder="e.g 2026">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="eg 08012345678">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder=" @gmail.com">
            </div>
            <div class="form-group full-width">
                <label>Home Address</label>
                <textarea id="address" rows="2" required placeholder="Residential Street Address, Sokoto"></textarea>
            </div>
            
            <!-- Shashen Zaɓan Hoto Daga Na'ura -->
            <div class="image-upload-box">
                <label style="display:block; margin-bottom:10px; font-weight: bold;">📁 Select Staff Passport Image </label>
                <input type="file" id="hotoInput" accept="image/*" required style="background: white; width: 100%; border: 1px dashed #777; padding: 10px;">
                <img id="imagePreview" alt="Preview na hoton Malami">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Save Complete Staff Record</button>
    </form>
</div>

<script>
    const hotoInput = document.getElementById('hotoInput');
    const imagePreview = document.getElementById('imagePreview');
    const form = document.getElementById('teacherRegistrationForm');
    const submitBtn = document.getElementById('submitBtn');

    // Wannan shi ne ainihin Web App URL dinka na dazo wanda ke aiki lafiya lau
    const WEB_APP_URL ='https://script.google.com/macros/s/AKfycbwCJrurq9zCYil49A_NVNjbaUSNU1uokg1amM5xv7hUjLEIChuMIqIjwpUYIQuTR3qG/exec'; 

    let hotoBase64 = ""; 

    // Karanta hoto don nunawa a screen kafin a aika
    hotoInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                hotoBase64 = e.target.result;
                imagePreview.src = hotoBase64;
                imagePreview.style.display = 'block';
            }
            reader.readAsDataURL(this.files[0]);
        }
    });

    form.addEventListener('submit', e => {
        e.preventDefault();
        if (!hotoBase64) {
            alert("Please select a teacher image first!");
            return;
        }

        submitBtn.innerText = "Submitting data... Please wait";
        submitBtn.disabled = true;

        // Sarrafa sunan hoto ya fito da Staff ID da sunan malami daki-daki
        const staff = document.getElementById('staffId').value.replace(/\//g, "-");
        const sunanMalami = document.getElementById('firstName').value + "_" + document.getElementById('surname').value;
        const sunanHoto = "Teacher_" + staff + "_" + sunanMalami + ".jpg";

        const teacherData = {
            action: "addTeacher",
            staffId: document.getElementById('staffId').value,
            ninNumber: document.getElementById('ninNumber').value,
            surname: document.getElementById('surname').value,
            firstName: document.getElementById('firstName').value,
            middleName: document.getElementById('middleName').value,
	    dob: document.getElementById('dob').value,
            gender: document.getElementById('gender').value,
            qualification: document.getElementById('qualification').value,
            staffType: document.getElementById('staffType').value,
            computerNum: document.getElementById('computerNum').value,
            subject: document.getElementById('subject').value,
            employmentYear: document.getElementById('employmentYear').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            hotoData: hotoBase64,
            hotoName: sunanHoto,
            hotoMimeType: "image/jpeg"
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(teacherData)
        })
        .then(() => {
            alert('✅ Success! Teacher record and image have been sent to Google Sheet.');
            form.reset();
            imagePreview.style.display = 'none';
            hotoBase64 = "";
            submitBtn.innerText = "Save Complete Staff Record";
            submitBtn.disabled = false;
        })
        .catch(error => {
            alert('An error occurred while sending the data!');
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
